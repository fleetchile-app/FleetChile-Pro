services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleetchile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fleetchile_pg:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/fleetchile
    ports:
      - "3000:3000"

volumes:
  fleetchile_pg:
