services:
  - type: web
    name: fleetchile-pro
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fleetchile-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: fleetchile-db
    plan: free
    databaseName: fleetchile
    user: fleetchile
